<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#CBD5E1"/>
  <!-- Sky background -->
  <rect width="400" height="180" fill="#93C5FD"/>
  <rect y="180" width="400" height="120" fill="#78716C"/>
  <!-- Ground and foundation -->
  <polygon points="0,220 400,200 400,300 0,300" fill="#57534E"/>
  <!-- Concrete Columns & Roof Slab -->
  <rect x="50" y="80" width="25" height="130" fill="#94A3B8"/>
  <rect x="140" y="75" width="25" height="135" fill="#64748B"/>
  <rect x="230" y="70" width="25" height="140" fill="#94A3B8"/>
  <rect x="320" y="65" width="25" height="145" fill="#64748B"/>
  <!-- Beam & Shuttering -->
  <polygon points="35,80 360,65 360,95 35,110" fill="#475569"/>
  <!-- Red Brick Infill Walls -->
  <rect x="75" y="110" width="65" height="85" fill="#B91C1C" opacity="0.85"/>
  <rect x="165" y="105" width="65" height="90" fill="#B91C1C" opacity="0.85"/>
  <rect x="255" y="100" width="65" height="95" fill="#B91C1C" opacity="0.85"/>
  <!-- Scaffolding lines -->
  <line x1="40" y1="210" x2="350" y2="70" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="40" y1="90" x2="350" y2="200" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Geotag watermark -->
  <rect x="15" y="260" width="170" height="24" rx="4" fill="rgba(15, 23, 42, 0.75)"/>
  <text x="25" y="276" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold">GPS: 25.2750° N, 84.7410° E</text>
</svg>
