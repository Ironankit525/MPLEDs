[project]
name = "mplads-image-module"
version = "2.0.0"
description = "MPLADS Image Fraud & Anomaly Detection Module"
requires-python = ">=3.10"

# ── Supported Python range ────────────────────────────────────────────
# Minimum determined by STATIC ANALYSIS of the codebase (grep for
# version-gated syntax), not by executing on 3.10/3.11/3.12 — this
# development machine only has Python 3.14 installed, no pyenv, so
# those versions could not actually be run here. Verify on a machine
# that has them (or via CI) before treating this as more than a
# well-founded estimate.
#
# What was checked (2026, Round 3):
#   - PEP 604 `X | Y` union syntax is used throughout (app/*.py,
#     scripts/*.py) WITHOUT `from __future__ import annotations`, so
#     these annotations are evaluated at function-definition time —
#     this alone requires Python >= 3.10. This is the binding
#     constraint; nothing else in the codebase requires more.
#   - PEP 585 builtin generics (list[...], dict[...], tuple[...]) are
#     used throughout — requires Python >= 3.9, already covered by 3.10.
#   - No `match` statements, no `except*`/ExceptionGroup, no
#     typing.Self, no tomllib, no datetime.UTC — none of the 3.11+-only
#     constructs appear anywhere in app/, scripts/, or tests/.
#   - Runtime dependencies (fastapi, pydantic 2.x, sqlalchemy 2.x,
#     torch, transformers) all support 3.10+ comfortably.
#
# If you have 3.10/3.11/3.12 available, the real verification step is:
#   python3.10 -m venv .venv310 && .venv310/bin/pip install -r requirements.txt \
#     && .venv310/bin/pytest tests/ -m "not slow and not requires_clip"
#
# pytest configuration (markers) stays in pytest.ini — kept as the
# single source of truth rather than duplicated here.
